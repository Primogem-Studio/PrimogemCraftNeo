plugins {
    id 'fabric-loom' version '1.7.4'
    id 'java-library'
    id 'idea'
}

version = project.mod_version
group = 'net.per'

base {
    archivesName = project.mod_id
}

repositories {
    mavenLocal()
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
    maven {
        name = 'Shedaniel'
        url = 'https://maven.shedaniel.me/'
    }
    maven {
        name = 'JEI'
        url = 'https://maven.blamejared.com/'
        content {
            includeGroup 'mezz.jei'
        }
    }
    maven {
        name = 'TerraformersMC'
        url = 'https://maven.terraformersmc.com/'
    }
    maven {
        name = 'Ladysnake'
        url = 'https://maven.ladysnake.org/releases'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // JEI/REI — locally remapped intermediary→Yarn jars (see tools/RemapDeps.java)
    compileOnly files('tools/remap-output/jei-1.20.1-common-api-intermediary-15.74.0.234-yarn.jar')
    compileOnly "mezz.jei:jei-${project.minecraft_version}-fabric-api:${project.jei_version}"
    compileOnly files('tools/remap-output/RoughlyEnoughItems-api-fabric-12.1.785-yarn.jar')
    compileOnly files('tools/remap-output/RoughlyEnoughItems-fabric-12.1.785-yarn.jar')
    compileOnly "me.shedaniel.cloth:basic-math:0.6.1"
    compileOnly "dev.architectury:architectury-fabric:9.0.7"

    // TaCZ: API stubs provided locally (Modrinth jar requires Loom 1.17+, incompatible with 1.7.4)
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-parameters'
    options.compilerArgs << '-Xmaxerrs' << '100000'
    options.fork = true
    options.forkOptions.jvmArgs += ['-Duser.language=en', '-Duser.country=US']
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

jar {
    from('LICENSE') {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}