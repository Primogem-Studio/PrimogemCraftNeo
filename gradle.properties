# ===== Gradle =====
org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# ForgeGradle 6 不支持 configuration cache，必须关闭
org.gradle.configuration-cache=false

# ===== Mod =====
mod_id=primogemcraft
mod_version=1.0.5

# ===== Minecraft / Forge =====
minecraft_version=1.20.1
forge_version=47.4.28

# ===== Mappings =====
mapping_channel=parchment
mapping_version=2023.09.03-1.20.1

# ===== Dependencies (1.20.1 Forge) =====
curios_version=5.14.1+1.20.1
jei_version=15.74.0.234
rei_version=12.1.785
cloth_version=11.1.136
jade_version=11.13.3+forge
create_version=mc1.20.1-6.0.8
tacz_version=1.1.8-hotfix2
farmersdelight_version=1.20.1-1.3.4
teyvatdelight_version=1.1.15-forge-1.20.1
